<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BFO Live • Digital Score</title>
    <style>
        :root {
            --primary: #FF6D00; /* Laranja Digital Score */
            --bg-body: #050505;
            --bg-card: #141414;
            --bg-header: #000000;
            --text-main: #ffffff;
            --text-sec: #b0b0b0;
            --border: #333333;
            /* Cores Logística */
            --color-warmup: #ff3d00;
            --color-queue: #00b0ff;
            --color-cap: #00e676;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg-body); color: var(--text-main); padding-bottom: 90px; }

        header {
            background-color: var(--bg-header);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(255, 109, 0, 0.15);
        }
        .header-brand { display: flex; align-items: center; gap: 10px; }
        .logo-img { height: 32px; width: auto; }
        .event-title { font-weight: 800; font-size: 0.95rem; color: #fff; letter-spacing: -0.5px; line-height: 1.1; }
        
        .live-badge { 
            background: rgba(255, 61, 0, 0.15); color: #FF3D00; padding: 4px 8px; 
            border-radius: 4px; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.5px;
            border: 1px solid rgba(255, 61, 0, 0.3); animation: pulse 2s infinite; 
            display: flex; align-items: center; gap: 5px; white-space: nowrap;
        }
        .live-dot { width: 6px; height: 6px; background-color: #FF3D00; border-radius: 50%; }

        /* Actions Scrollable */
        .quick-actions-wrapper {
            background: var(--bg-card); border-bottom: 1px solid var(--border);
            overflow-x: auto; scrollbar-width: none; /* Hide scrollbar */
        }
        .quick-actions {
            display: flex; gap: 10px; padding: 15px; min-width: max-content;
        }
        .action-btn {
            background: #1f1f1f; border: 1px solid var(--border); border-radius: 8px; padding: 12px 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; transition: 0.2s; min-width: 90px;
        }
        .action-btn:active { transform: scale(0.96); border-color: var(--primary); }
        .action-icon { 
            width: 24px; height: 24px; margin-bottom: 6px; 
            fill: none; stroke: var(--primary); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
        }
        .action-text { font-size: 0.65rem; color: var(--text-sec); font-weight: 500; text-align: center; white-space: nowrap; }

        /* Filters */
        .controls-wrapper {
            position: sticky; top: 63px; z-index: 90;
            background: var(--bg-body); padding-bottom: 5px; border-bottom: 1px solid #222;
        }
        .search-container { padding: 12px 15px 8px 15px; }
        .search-input-wrapper { position: relative; background: #1a1a1a; border-radius: 8px; border: 1px solid #333; }
        .search-icon-inside {
            position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
            width: 18px; height: 18px; fill: #666;
        }
        .search-input {
            width: 100%; background: transparent; border: none; padding: 10px 10px 10px 36px;
            color: white; font-size: 0.9rem; outline: none;
        }

        .date-tabs { display: flex; padding: 5px 15px 10px 15px; gap: 8px; }
        .date-btn {
            background: transparent; color: #666; border: 1px solid #333; padding: 8px 0;
            border-radius: 6px; font-weight: 700; flex: 1; cursor: pointer; transition: 0.2s; font-size: 0.85rem;
        }
        .date-btn.active {
            background: var(--primary); color: #000; border-color: var(--primary);
            box-shadow: 0 0 10px rgba(255, 109, 0, 0.3);
        }

        .category-scroll {
            display: flex; overflow-x: auto; padding: 0 15px 10px 15px; gap: 8px; scrollbar-width: none;
        }
        .cat-pill {
            background: #222; color: #fff; border: 1px solid #333; padding: 5px 14px;
            border-radius: 20px; font-size: 0.75rem; white-space: nowrap; font-weight: 500;
        }
        .cat-pill.active { border-color: var(--primary); background: rgba(255, 109, 0, 0.1); color: var(--primary); }

        /* Timeline */
        .timeline { padding: 10px 15px; min-height: 60vh; }
        
        .heat-card {
            background-color: var(--bg-card); border-radius: 10px; margin-bottom: 14px;
            border: 1px solid var(--border); position: relative; overflow: hidden;
        }
        .heat-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--primary);
        }
        .heat-card.fr::before { background: #E91E63; }

        /* Completed State */
        .heat-card.completed { opacity: 0.6; filter: grayscale(0.8); border-left-color: #555 !important; }
        .heat-card.completed::before { background: #555; }
        .finished-badge { background: #333; color: #aaa; font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; display: inline-block; margin-bottom: 4px; }

        .heat-header {
            padding: 12px 15px; display: grid; grid-template-columns: 50px 1fr 20px;
            align-items: center; cursor: pointer;
        }

        .time-box {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-right: 1px solid #333; padding-right: 10px; margin-right: 12px;
        }
        .time-val { font-size: 1.1rem; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
        .time-label { font-size: 0.55rem; color: #666; text-transform: uppercase; font-weight: 700; margin-top: 2px; }

        .heat-info h3 { font-size: 0.9rem; font-weight: 700; color: #fff; margin-bottom: 6px; line-height: 1.2; }
        
        .logistics-bar {
            display: flex; gap: 10px; font-size: 0.75rem; background: #252525;
            padding: 5px 10px; border-radius: 4px; display: inline-flex; margin-bottom: 6px; flex-wrap: wrap;
        }
        .log-item { display: flex; align-items: center; gap: 4px; font-weight: 700; letter-spacing: 0.3px; }
        .icon-warmup { fill: var(--color-warmup); }
        .text-warmup { color: var(--color-warmup); }
        .icon-queue { fill: var(--color-queue); }
        .text-queue { color: var(--color-queue); }
        .icon-cap { fill: var(--color-cap); }
        .text-cap { color: var(--color-cap); }

        .heat-meta { font-size: 0.75rem; color: #888; display: flex; align-items: center; gap: 8px; }
        
        .workout-tag {
            font-size: 0.7rem; color: var(--primary); border: 1px solid rgba(255, 109, 0, 0.3);
            padding: 1px 6px; border-radius: 4px; font-weight: 700; text-transform: uppercase;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .workout-name { color: #fff; font-weight: 400; text-transform: none; margin-left: 2px; }

        .chevron { width: 18px; height: 18px; fill: #555; transition: 0.3s; }
        .heat-card.open .chevron { transform: rotate(180deg); fill: var(--primary); }

        .heat-details {
            max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: #1a1a1a;
        }
        .heat-card.open .heat-details { max-height: 2000px; border-top: 1px solid #333; }

        .athlete-row {
            display: grid; grid-template-columns: 35px 1fr; padding: 10px 15px;
            border-bottom: 1px solid #2a2a2a; align-items: center;
        }
        .athlete-row:last-child { border-bottom: none; }
        
        .lane-box {
            width: 24px; height: 24px; background: #333; color: #bbb; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.75rem;
        }
        .ath-info { display: flex; flex-direction: column; }
        .ath-header { display: flex; align-items: center; gap: 6px; }
        .ath-num { 
            color: var(--primary); font-weight: 700; font-size: 0.75rem;
            background: rgba(255, 109, 0, 0.1); padding: 1px 4px; border-radius: 3px; 
        }
        .ath-name { font-weight: 600; font-size: 0.85rem; color: #eee; }
        .ath-box { font-size: 0.7rem; color: #777; margin-top: 2px; text-transform: uppercase; }

        footer { text-align: center; padding: 25px; color: #444; font-size: 0.7rem; }
        .empty-msg { text-align: center; color: #666; padding: 40px; font-style: italic; }

        #error-msg { display:none; padding:20px; color:red; text-align:center; }
        #force-load { display:none; margin: 20px auto; padding: 10px 20px; background: #333; color: #fff; border: 1px solid #555; border-radius: 5px; cursor: pointer; }
    </style>

        ];

        /* ================== APP LOGIC ================== */
        const scheduleData = [...fridayData, ...saturdayData, ...sundayData];

        // Start on Saturday
        let currentDay = 'sabado';
        let currentCat = 'all';
        let searchTerm = '';

        function render() {
            try {
                const container = document.getElementById('timeline-container');
                const errorMsg = document.getElementById('error-msg');
                const forceBtn = document.getElementById('force-load');
                
                container.innerHTML = '';
                if(errorMsg) errorMsg.style.display = 'none';
                if(forceBtn) forceBtn.style.display = 'none';

                let filtered = scheduleData.filter(item => {
                    const dayMatch = item.day === currentDay;
                    const catMatch = currentCat === 'all' ? true : item.tags.includes(currentCat);
                    return dayMatch && catMatch;
                });

                if (searchTerm) {
                    filtered = filtered.filter(item => {
                        const hasMatch = item.athletes.some(ath => {
                            const nameMatch = ath.name && ath.name.toLowerCase().includes(searchTerm);
                            const numMatch = ath.num && ath.num.toString().includes(searchTerm);
                            return nameMatch || numMatch;
                        });
                        return hasMatch;
                    });
                }

                if (filtered.length === 0) {
                    let msg = `Nenhuma bateria encontrada`;
                    if (searchTerm) msg += ` para "${searchTerm}"`;
                    else if (currentDay === 'domingo' && currentCat === 'fr') msg = `Fitness Race acontece apenas no Sábado`;
                    container.innerHTML = `<div class="empty-msg">${msg}.</div>`;
                    return;
                }

                filtered.forEach((item, index) => {
                    const isFR = item.tags.includes('fr');
                    const isCompleted = item.day === 'sexta';
                    const card = document.createElement('div');
                    card.className = `heat-card ${isFR ? 'fr' : ''} ${isCompleted ? 'completed' : ''}`;
                    if(searchTerm.length > 0) card.classList.add('open');
                    
                    let athletesHTML = '';
                    item.athletes.forEach(ath => {
                        const numDisplay = ath.num ? `<span class="ath-num">#${ath.num}</span>` : '';

                            <div class="athlete-row">
                                <div class="lane-box">${ath.lane}</div>
                                <div class="ath-info">
                                    <div class="ath-header">
                                        ${numDisplay}
                                        <div class="ath-name">${ath.name}</div>
                                    </div>
                                    <span class="ath-box">${ath.box}</span>
                                </div>
                            </div>
                        `;
                    });

                    // Logic for Logistics Bar
                    let logisticBar = '';
                    if (item.warmup || item.queue || item.cap) {
                        logisticBar = `
                            <div class="logistics-bar">
                                ${item.warmup ? `

                                        <span class="text-warmup">Aq: ${item.warmup}</span>
                                    </div>
                                ` : ''}
                                ${item.queue ? `
                                    <div class="log-item" style="margin-left:8px;">
                                        <svg class="icon-queue" style="width:14px;height:14px;" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V18c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-1.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05.02.01.03.03.04.04 1.14.83 1.93 1.94 1.93 3.41V18c0 .35-.07.69-.18 1H22c.55 0 1-.45 1-1v-1.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                                        <span class="text-queue">Fila: ${item.queue}</span>
                                    </div>
                                ` : ''}
                                ${item.cap ? `
                                    <div class="log-item" style="margin-left:8px;">

                                        <span class="text-cap">Cap: ${item.cap}</span>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    }

                    // Workout Tag
                    let wodTag = `
                        <span class="workout-tag">

                            ${item.wodName ? `<span class="workout-name">| ${item.wodName}</span>` : ''}

                    // Badge Completed
                    let statusBadge = '';
                    if (isCompleted) {
                        statusBadge = `<div class="finished-badge">ENCERRADO</div>`;
                    }

                    card.innerHTML = `
                        <div class="heat-header" onclick="toggleDetails(this)">
                            <div class="time-box">
                                <span class="time-val">${item.time}</span>
                                <span class="time-label">Horário</span>
                            </div>

                        <div class="heat-details">

                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error(e);
                document.getElementById('timeline-container').innerHTML = '';
                if(document.getElementById('error-msg')) document.getElementById('error-msg').style.display = 'block';
                if(document.getElementById('force-load')) document.getElementById('force-load').style.display = 'block';
            }
        }

        function updateSearch(val) {
            searchTerm = val.toLowerCase().trim();
            render();
        }

        function toggleDetails(headerEl) {
            const card = headerEl.parentElement;
            if (card.classList.contains('open')) {
                card.classList.remove('open');
            } else {
                card.classList.add('open');
            }
        }

        function setDay(day) {
            currentDay = day;
            document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${day}`).classList.add('active');
            render();
        }

        function filterCategory(cat, btn) {
            currentCat = cat;
            document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (cat === 'fr') {
                setDay('sabado'); 
            } else {
                render();
            }
        }

        // Init
        window.onload = render;
