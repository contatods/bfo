<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BFO Live • Digital Score</title>
    <style>
        :root {
            --primary: #FF6D00;
            --bg-body: #050505;
            --bg-card: #141414;
            --bg-header: #000000;
            --text-main: #ffffff;
            --text-sec: #9e9e9e;
            --border: #333333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg-body); color: var(--text-main); padding-bottom: 90px; }

        header {
            background-color: var(--bg-header);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(255, 109, 0, 0.1);
        }
        .logo-img { height: 35px; width: auto; }
        .live-badge { 
            background: rgba(255, 61, 0, 0.2); 
            color: #FF3D00; 
            padding: 4px 10px; 
            border-radius: 4px; 
            font-size: 0.75rem; 
            font-weight: 800; 
            letter-spacing: 1px;
            border: 1px solid rgba(255, 61, 0, 0.5);
            animation: pulse 2s infinite; 
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .live-dot { width: 6px; height: 6px; background-color: #FF3D00; border-radius: 50%; }

        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            padding: 15px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }
        .action-btn {
            background: #1f1f1f;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            transition: 0.2s;
        }
        .action-btn:active { transform: scale(0.95); border-color: var(--primary); }
        .action-icon { width: 24px; height: 24px; margin-bottom: 5px; fill: var(--primary); }
        .action-text { font-size: 0.7rem; color: var(--text-sec); font-weight: 500; text-align: center; }

        .controls-wrapper {
            position: sticky;
            top: 66px;
            z-index: 90;
            background: var(--bg-body);
            padding-bottom: 5px;
            border-bottom: 1px solid #222;
        }

        .search-container { padding: 10px 15px 5px 15px; }
        .search-input-wrapper {
            position: relative;
            background: #222;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .search-icon-inside {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-sec);
        }
        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 12px 12px 12px 38px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .date-tabs { display: flex; padding: 10px 15px; gap: 10px; }
        .date-btn {
            background: transparent;
            color: var(--text-sec);
            border: 1px solid var(--border);
            padding: 8px 0;
            border-radius: 6px;
            font-weight: 700;
            flex: 1;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .date-btn.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255, 109, 0, 0.4);
        }

        .category-scroll {
            display: flex;
            overflow-x: auto;
            padding: 0 15px 10px 15px;
            gap: 8px;
            scrollbar-width: none;
        }
        .category-scroll::-webkit-scrollbar { display: none; }
        
        .cat-pill {
            background: #222;
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            white-space: nowrap;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .cat-pill.active {
            border-color: var(--primary);
            background: rgba(255, 109, 0, 0.15);
            color: var(--primary);
        }

        .timeline { padding: 10px 15px; min-height: 50vh; }
        
        .heat-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }
        .heat-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: var(--primary);
        }
        .heat-card.fr::before { background: #E91E63; } 
        .heat-card.fr .workout-tag { color: #E91E63; border-color: rgba(233,30,99,0.3); }

        .heat-header {
            padding: 15px;
            display: grid;
            grid-template-columns: 55px 1fr 24px;
            align-items: center;
            cursor: pointer;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #333;
            padding-right: 10px;
            margin-right: 10px;
        }
        .time-val { font-size: 1.1rem; font-weight: 800; color: #fff; }
        .time-label { font-size: 0.6rem; color: var(--text-sec); text-transform: uppercase; }

        .heat-info h3 { font-size: 0.95rem; font-weight: 700; color: #fff; margin-bottom: 4px; line-height: 1.2; }
        .heat-meta { font-size: 0.75rem; color: var(--text-sec); display: flex; align-items: center; gap: 8px; }
        
        .workout-tag {
            font-size: 0.65rem;
            color: var(--primary);
            border: 1px solid rgba(255, 109, 0, 0.3);
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .chevron { width: 20px; height: 20px; fill: var(--text-sec); transition: 0.3s; }
        .heat-card.open .chevron { transform: rotate(180deg); fill: var(--primary); }

        .heat-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: #1a1a1a;
        }
        .heat-card.open .heat-details { max-height: 2000px; border-top: 1px solid #333; }

        .athlete-row {
            display: grid;
            grid-template-columns: 40px 1fr;
            padding: 12px 15px;
            border-bottom: 1px solid #2a2a2a;
            align-items: center;
        }
        .athlete-row:last-child { border-bottom: none; }
        
        .lane-box {
            width: 28px; height: 28px;
            background: #333;
            color: #aaa;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.8rem;
        }
        .ath-info { display: flex; flex-direction: column; }
        
        .ath-header { display: flex; align-items: center; gap: 6px; }
        .ath-num { 
            color: var(--primary); 
            font-weight: 700; 
            font-size: 0.8rem; 
            background: rgba(255, 109, 0, 0.1); 
            padding: 1px 4px; 
            border-radius: 3px; 
        }
        .ath-name { font-weight: 600; font-size: 0.9rem; color: #eee; }
        .ath-box { font-size: 0.75rem; color: var(--text-sec); margin-top: 2px; }

        footer { text-align: center; padding: 20px; color: #444; font-size: 0.7rem; }
        .empty-msg { text-align: center; color: var(--text-sec); padding: 40px; font-style: italic; opacity: 0.7; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        .dt-primary { fill: var(--primary); }
        .dt-secondary { fill: #fff; opacity: 0.4; }
        
    </style>
</head>

        let currentDay = 'sexta';
        let currentCat = 'all';
        let searchTerm = '';

        function render() {
            try {
                const container = document.getElementById('timeline-container');
                container.innerHTML = '';

                if (currentDay === 'domingo') {
                    container.innerHTML = `<div class="empty-msg">A programação de Domingo será liberada em breve.</div>`;
                    return;
                }
                
                let filtered = scheduleData.filter(item => {
                    return item.day === currentDay && (currentCat === 'all' || item.tags.includes(currentCat));
                });

                if (searchTerm) {
                    filtered = filtered.filter(item => {
                        return item.athletes.some(ath => {
                            return ath.name.toLowerCase().includes(searchTerm) || (ath.num && ath.num.toString().includes(searchTerm));
                        });
                    });
                }

                if (filtered.length === 0) {
                    let msg = `Nenhuma bateria encontrada`;
                    if (searchTerm) msg += ` para "${searchTerm}"`;
                    container.innerHTML = `<div class="empty-msg">${msg}.</div>`;
                    return;
                }

                filtered.forEach((item, index) => {
                    const isFR = item.tags.includes('fr');
                    const card = document.createElement('div');
                    card.className = `heat-card ${isFR ? 'fr' : ''}`;
                    if(searchTerm.length > 0) card.classList.add('open');
                    
                    let athletesHTML = '';
                    item.athletes.forEach(ath => {
                        const numDisplay = ath.num ? `<span class="ath-num">#${ath.num}</span>` : '';
                        athletesHTML += `
                            <div class="athlete-row">
                                <div class="lane-box">${ath.lane}</div>
                                <div class="ath-info">
                                    <div class="ath-header">
                                        ${numDisplay}
                                        <div class="ath-name">${ath.name}</div>
                                    </div>
                                    <span class="ath-box">${ath.box}</span>
                                </div>
                            </div>
                        `;
                    });

                    card.innerHTML = `
                        <div class="heat-header" onclick="this.parentElement.classList.toggle('open')">
                            <div class="time-box">
                                <span class="time-val">${item.time}</span>
                                <span class="time-label">Horário</span>
                            </div>
                            <div class="heat-info">
                                <h3>${item.cat}</h3>
                                <div class="heat-meta">
                                    <span>${item.athletes.length} raias</span>
                                    <span class="workout-tag">${item.workout}</span>
                                </div>
                            </div>
                            <svg class="chevron" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
                        </div>
                        <div class="heat-details">
                            ${athletesHTML}
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error(e);
                document.getElementById('timeline-container').innerHTML = '<div style="padding:20px; color:red; text-align:center;">Erro ao carregar dados.</div>';
            }
        }

        function updateSearch(val) {
            searchTerm = val.toLowerCase().trim();
            render();
        }

        function setDay(day) {
            currentDay = day;
            document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${day}`).classList.add('active');
            render();
        }

        function filterCategory(cat, btn) {
            currentCat = cat;
            document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (cat === 'fr') {
                setDay('sabado'); 
            } else {
                render();
            }
        }

        // Inicializa
        window.onload = render;
    </script>
